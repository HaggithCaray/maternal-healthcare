services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: healthcare-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - healthcare
    depends_on:
      db:
        condition: service_healthy

  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: healthcare-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host="0.0.0.0" --port=8080 --debug
    volumes:
      - ./:/var/www
    ports:
      - "8082:8080"
    networks:
      - healthcare
    depends_on:
      - app

  web:
    image: nginx:alpine
    container_name: healthcare-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - healthcare
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: healthcare-db
    restart: unless-stopped
    command: --skip-name-resolve
    environment:
      MYSQL_DATABASE: healthcare_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: healthcare_user
      MYSQL_PASSWORD: healthcare123
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - healthcare
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: healthcare-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    networks:
      - healthcare
    depends_on:
      - db

networks:
  healthcare:
    driver: bridge

volumes:
  dbdata:
